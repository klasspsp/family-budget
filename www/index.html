<!doctype html>
<html lang="ru">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейный бюджет</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#101820;--ink:#e8eef2;--mut:#8b9aa6;--line:#26333e;--fld:#182430;--a:#6f9be6;--b:#e0a83a;--btn:#e8eef2;--btnt:#101820;--err:#ff8a80;--pos:#5fd08a;--f:#58c9a0;--ta:#1d2c44;--tb:#3a2f17;--tf:#183a30;--ona:#101820;--onb:#101820;--onf:#101820;--cr:#f08a72;--tcr:#3d2019;--ocr:#101820;--ci:#4fc3cf;--tci:#14343a;--oci:#101820;--cp:#b79cf0;--tcp:#2b2145;--ocp:#101820}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;position:relative}
.wrap{max-width:480px;margin:0 auto;padding:18px 18px 96px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 14px;padding-right:48px}
.num{font-family:Georgia,serif;font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--tcp);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{flex:1;padding:8px 2px;min-height:52px;border:0;background:none;color:var(--ink);font:600 14px system-ui,sans-serif;line-height:1.15}
.tabs button.on{color:var(--cp);box-shadow:inset 0 3px 0 var(--cp)}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--fld);color:var(--ink);font:inherit}
input#amt{font:600 30px Georgia,serif;padding:10px 12px;border:2px solid var(--cp)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--fld);color:var(--ink);font:600 15px system-ui,sans-serif}
.seg button.on{border-color:var(--cp);background:var(--cp);color:var(--ocp);box-shadow:none}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{padding:10px 4px;border:1px solid var(--cp);border-radius:8px;background:var(--tcp);color:var(--ink);font:15px system-ui,sans-serif}
.cats button.on{background:var(--cp);color:var(--ocp);font-weight:600}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;background:var(--cp);color:var(--ocp);font:600 17px system-ui,sans-serif}
.msg{min-height:20px;margin-top:8px;color:var(--mut);font-size:14px}
h2{font:600 18px Georgia,serif;margin:26px 0 4px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}.row .s{font-size:13px;color:var(--mut)}
.row .x{border:0;background:none;color:var(--cr);font-size:24px;padding:4px 8px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav button{border:0;background:var(--tcp);color:var(--cp);border-radius:10px;font-size:26px;padding:4px 14px}
.nav b{font:600 18px Georgia,serif}
.big{font-size:44px;line-height:1.1;margin:6px 0 12px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.who{display:flex;justify-content:space-between;margin-top:8px;font-size:15px;flex-wrap:wrap;gap:6px 14px}
.cat{padding:12px 0;border-bottom:1px solid var(--line)}
.cat .h{display:flex;justify-content:space-between;margin-bottom:6px}
.empty{color:var(--mut);padding:18px 0}
.tiny{margin-top:22px;font-size:13px;color:var(--mut)}
.tiny button{border:0;background:none;color:var(--mut);text-decoration:underline;font:inherit;padding:0}
.err{color:var(--err)}
.pos{color:var(--pos)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.emo button{font-size:22px;padding:6px 0;border:1px solid var(--tcp);border-radius:8px;background:var(--tcp)}
.emo button.on{border-color:var(--cp);background:var(--cp)}
.lk{border:0;background:var(--tcp);color:var(--cp);border-radius:8px;padding:8px 12px;font:600 15px system-ui,sans-serif}
.ed{padding:14px 0;border-bottom:1px solid var(--line)}
.ed .two{display:flex;gap:8px;margin-top:14px}
.ed .two button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--tcp);color:var(--ink);font:600 15px system-ui,sans-serif}
.ed .two .ok{background:var(--cp);color:var(--ocp);border-color:var(--cp)}
.ed .two button[data-a="x"]{background:var(--tcr);border-color:var(--cr)}
.ed .two .ok[data-a="d"]{background:var(--cr);color:var(--ocr);border-color:var(--cr)}
.mv{border:1px solid var(--cp);border-radius:6px;background:var(--tcp);color:var(--cp);padding:4px 9px;font-size:16px;margin-left:3px}
.mv:disabled{opacity:.3}
.up{position:fixed;right:14px;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:none;padding:10px 14px;border:0;border-radius:20px;background:var(--cp);color:var(--ocp);font:600 14px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:9}
.up.show{display:block}
.gear{position:absolute;top:14px;right:max(14px,calc((100% - 480px)/2 + 14px));width:44px;height:44px;border:0;background:var(--tcp);border-radius:10px;color:var(--cp);display:flex;align-items:center;justify-content:center;z-index:2}
.stk{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:1;padding:0 0 8px;margin-top:6px}
.stt{font-size:14px;margin-top:6px;min-height:20px}
mark{background:#ffe58a;color:#14222f;border-radius:3px;padding:0 1px}
.addrow{background:var(--tcp);border:2px dashed var(--cp);border-radius:8px;padding:10px 12px}
</style>
</head>
<body>
<button class="gear" id="t2" aria-label="Настройки" title="Настройки"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
<div class="wrap" id="app">Загрузка данных из облака...</div>
<div class="tabs"><button id="t0">Доходы/<wbr>Расходы</button><button id="t1">Итоги</button><button id="t3">Покупки</button></div>
<button class="up" id="up" aria-label="Наверх">↑ Наверх</button>
<script>
// Инициализация Supabase
const SUPABASE_URL = "https://faqtgrfotmerztanpjnx.supabase.co";
const SUPABASE_KEY = "sb_publishable_0kA0FRSWNVtj7qJFYnkqQA_eZeW-pWj";
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let DEFE=[["Продукты","🛒",0],["Дом","🏠",1],["Транспорт","🚗",2],["Здоровье","💊",3],["Отдых","🎈",4],["Прочее","📦",5]];
let DEFI=[["Зарплата","💼",0],["Пособия","👶",1],["Подработка","🛠\uFE0F",2],["Прочее","💰",3]];
let SEC=[["Продукты","🛒",0,1],["Бытовая химия","🧽",1,1],["Одежда","👕",2],["Стройматериалы","🧱",3],["Электроника","💻",4],["Список желаний","⭐",5]],CATS=DEFE,INC=DEFI,NX=100;

let EM=["🛒","🍎","🥖","☕","🍽\uFE0F","🏠","💡","🔧","🛋\uFE0F","🚗","⛽","🚌","🚲","✈\uFE0F","💊","🏥","🦷","👕","👟","🎈","🎬","🎁","📚","🎓","👶","🧸","🐶","🐱","💇","🧴","📱","💻","🌐","🧽","🧹","🔨","🧱","🎧","⭐","🏋\uFE0F","🎮","🎵","💳","📦","💼","💰","🏦","🛠\uFE0F","📈","💵"];

let FAMILY=["Александр", "Оксана", "Руслан", "Анастасия", "Мл. Александр", "Семья"];
let PALETTE=["#6f9be6","#e0a83a","#58c9a0","#b79cf0","#4fc3cf","#f08a72"];

let nmsg="";
let CURS={EUR:["€","Евро","de-DE"],CZK:["Kč","Чешская крона","cs-CZ"],USD:["$","Доллар США","en-US"],RUB:["₽","Российский рубль","ru-RU"]},CUR="EUR";

let now=new Date(),mo=new Date(now.getFullYear(),now.getMonth(),1),view=0,cur={t:"e",who:0,cat:0},msg="",bad=false,ed=null,eix=null,lim=10,prev=0;

let shop=[],shopSec=null,col={},smode="buy",sq="",lastB=null;
let items=[];

// Функция синхронизации с облаком (сохранение) с отладкой
async function syncToCloud() {
    try {
        const payloadData = {
            cats: { e: CATS, i: INC, s: SEC, v: 3, nx: NX },
            family: FAMILY,
            shop: shop,
            exp: items,
            cur: CUR
        };
        let { error } = await _supabase.from('app_data').upsert({
            id: 'main_data',
            payload: payloadData
        });
        if (error) {
            console.error("Supabase sync error:", error.message, error.details);
        } else {
            console.log("Supabase sync success!");
        }
    } catch(e) {
        console.error("Exception during syncToCloud:", e);
    }
}

function saveC() { syncToCloud(); }
function saveFamily() { syncToCloud(); }
function saveS() { syncToCloud(); }
function save() { syncToCloud(); }

// Загрузка данных из Supabase при старте приложения с отладкой
async function loadFromCloud() {
    try {
        let { data, error } = await _supabase
            .from('app_data')
            .select('payload')
            .eq('id', 'main_data')
            .single();
            
        if (error) {
            console.log("Supabase load notice (using fallback):", error.message);
        }
            
        if (data && data.payload) {
            let p = data.payload;
            if (p.cats) { CATS = p.cats.e; INC = p.cats.i; NX = p.cats.nx || 100; if(p.cats.s) SEC = p.cats.s; }
            if (p.family) FAMILY = p.family;
            if (p.shop) shop = p.shop;
            if (p.exp) items = p.exp;
            if (p.cur) CUR = p.cur;
            console.log("Data successfully loaded from Supabase!");
        } else {
            let z = JSON.parse(localStorage.getItem("cats") || "null");
            if(z && z.e && z.i){ CATS = z.e; INC = z.i; NX = z.nx || 100; if(z.s) SEC = z.s; }
            let f = JSON.parse(localStorage.getItem("family") || "null");
            if(f && Array.isArray(f) && f.length) FAMILY = f;
            let cu = localStorage.getItem("cur");
            if(cu && CURS[cu]) CUR = cu;
            shop = JSON.parse(localStorage.getItem("shop") || "[]");
            items = JSON.parse(localStorage.getItem("exp") || "null");
            if(!items){
                items=[{a:64.2,w:0,c:0,d:ds(now),n:"Wocheneinkauf"},{a:49,w:1,c:2,d:ds(now),n:"Deutschlandticket"},{a:2400,w:0,c:0,d:ds(now),n:"Зарплата",t:"i"}];
                items.forEach(x=>x.demo=1);
            }
            syncToCloud();
        }
    } catch(e) {
        console.error("Exception during loadFromCloud:", e);
    }
}

function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function LST(t){return t=="i"?INC:t=="s"?SEC:CATS}
function cat(t,id){let L=LST(t);for(let k=0;k<L.length;k++)if(L[k][2]==id)return L[k];return["Без категории","❔",id]}
function ensure(){let L=LST(cur.t);if(!L.some(c=>c[2]==cur.cat))cur.cat=L.length?L[0][2]:null}

shop.forEach(x=>{if(isCat(x.s)&&x.b===undefined)x.b=x.d?0:1});
function eur(n){try{return n.toLocaleString(CURS[CUR][2],{style:"currency",currency:CUR})}catch(e){return n.toFixed(2)+" "+CURS[CUR][0]}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function inMonth(){return items.filter(i=>i.d.slice(0,7)===key(mo))}
function dd(s){let p=s.split("-");return p[2]+"."+p[1]+"."}
function g(id){return document.getElementById(id)}
function getCol(w){return PALETTE[w%PALETTE.length]}
function bar3(b,s,st){return '<div class="bar"'+(st?' style="'+st+'"':"")+'>'+b.map((val,k)=>'<i style="width:'+(s?val/s*100:0+'%;background:'+getCol(k))+'"></i>').join("")+'</div>'}
function whoSummary(b){return FAMILY.map((w,k)=>b[k]?w+" "+eur(b[k]):"").filter(Boolean).join(", ")}

function add(){
  ensure();
  if(cur.cat===null){msg="Сначала добавьте категорию.";bad=true;keep();return}
  let rawAmt=g("amt").value.trim().replace(/\s/g,"").replace(",",".");
  let a=parseFloat(rawAmt);
  if(!(a>0)){msg="Введите корректную сумму цифрами.";bad=true;keep();g("amt").focus();return}
  let d=g("dt").value||ds(now),n=g("nt").value.trim(),it=cur.t=="i";
  let o={a:a,w:cur.who,c:cur.cat,d:d,n:n};if(it)o.t="i";
  if(eix!==null&&items[eix]){items[eix]=o;msg="Запись изменена.";eix=null}
  else{items.push(o);msg="Добавлено: "+eur(a)+", "+cat(cur.t,cur.cat)[0]+", "+FAMILY[cur.who]+"."}
  save();bad=false;
  let m=new Date(d+"T00:00:00");mo=new Date(m.getFullYear(),m.getMonth(),1);draw()
}
function del(i){items.splice(i,1);eix=null;save();draw()}
function startEdit(i){let x=items[i];if(!x)return;eix=i;cur.t=x.t=="i"?"i":"e";cur.who=x.w;cur.cat=x.c;msg="";bad=false;draw();g("amt").value=String(x.a).replace(".",",");g("dt").value=x.d;g("nt").value=x.n||"";window.scrollTo(0,0)}
function clearDemo(){items=items.filter(x=>!x.demo);save();draw()}

function edHtml(){
  let h='<div class="ed"><label for="en">Название</label><input id="en" value="'+esc(ed.n)+'" placeholder="Например, Кафе" autocomplete="off"><label>Картинка</label><div class="emo">'+EM.map(e=>'<button data-e="'+e+'"'+(ed.e==e?' class="on"':"")+'>'+e+'</button>').join("")+'</div>';
  if(ed.t=="s")h+='<label>Тип раздела</label><div class="seg"><button class="'+(ed.k?"on":"")+'" data-k="1">Каталог</button><button class="'+(ed.k?"":"on")+'" data-k="0">Разовый список</button></div>';
  if(ed.conf)h+='<div class="msg err">Записи с этой категорией останутся без категории. Удалить?</div><div class="two"><button data-a="c">Отмена</button><button class="ok" data-a="d">Да, удалить</button></div>';
  else h+='<div class="msg err">'+esc(ed.err||"")+'</div><div class="two"><button data-a="c">Отмена</button>'+(ed.id!==null?'<button data-a="x">Удалить</button>':"")+'<button class="ok" data-a="s">Сохранить</button></div>';
  return h+'</div>'
}
function mvb(t,id,d,txt,off){return '<button class="mv" data-mv="'+t+":"+id+":"+d+'"'+(off?" disabled":"")+' aria-label="'+({top:"В начало",up:"Выше",down:"Ниже"})[d]+'">'+txt+'</button>'}
function isCat(id){for(let c of SEC)if(c[2]===id)return !!c[3];return false}

function shopHtml(){
  if(!SEC.some(c=>c[2]===shopSec))shopSec=SEC.length?SEC[0][2]:null;
  let h='<h1>Покупки</h1>';
  if(!SEC.length)return h+'<div class="empty">Добавьте разделы в настройках.</div>';
  h+='<div class="seg"><button class="'+(smode=="buy"?"on":"")+'" data-md="buy">Купить</button><button class="'+(smode=="all"?"on":"")+'" data-md="all">Все</button></div>';
  h+='<label>Новые пункты добавляются в раздел</label><div class="cats">'+SEC.map(c=>'<button'+(shopSec===c[2]?' class="on"':"")+' data-ss="'+c[2]+'">'+c[1]+" "+esc(c[0])+'</button>').join("")+'</div>';
  h+='<div class="stk"><label for="si">Найти или добавить</label><input id="si" value="'+esc(sq)+'" placeholder="Например: молоко" autocomplete="off"><div id="st" class="stt">'+statusHtml()+'</div></div>';
  if(smode=="buy"&&lastB!==null){let k=sf(String(lastB));if(k>=0)h+='<div class="s" style="margin-top:10px">Куплено: '+esc(shop[k].n)+' <button class="lk" id="ub">Отменить</button></div>'}
  return h+'<div id="sr">'+resHtml()+'</div>'
}
function hl(n){let ql=sq.trim().toLowerCase(),k=ql?n.toLowerCase().indexOf(ql):-1;if(k<0)return esc(n);return esc(n.slice(0,k))+"<mark>"+esc(n.slice(k,k+ql.length))+"</mark>"+esc(n.slice(k+ql.length))}
function statusHtml(){
  let ql=sq.trim().toLowerCase();
  if(!ql)return '<span style="color:var(--mut)">Введите название для проверки.</span>';
  let m=shop.filter(x=>x.n.toLowerCase().indexOf(ql)>=0).length,ex=shop.some(x=>x.n.toLowerCase()===ql);
  if(ex)return '<b class="pos">✔ Такой пункт уже есть</b>';
  return m?'<b>Похожих: '+m+'</b>':'<b style="color:var(--cr)">Новый пункт.</b> Можно добавить.'
}
function itemRow(x){
  let c=isCat(x.s),n=c?!!x.b:!x.d,ic,st="",tag="",look=smode=="all"||sq.trim();
  if(c){ic=(n&&look)?"☑":"☐";if(!n)st=' style="color:var(--mut)"';else if(look){st=' style="font-weight:600"';tag='<span class="s">в списке</span>'}}
  else{ic=x.d?"☑":"☐";if(x.d)st=' style="text-decoration:line-through;color:var(--mut)"'}
  return '<div class="row" data-sd="'+x.id+'" style="cursor:pointer"><span style="font-size:22px">'+ic+'</span><div class="t"'+st+'>'+hl(x.n)+'</div>'+tag+'<button class="x" data-sx="'+x.id+'" aria-label="Удалить">×</button></div>'
}
function resHtml(){
  let ql=sq.trim().toLowerCase(),h="",any=false,G=SEC.slice();
  if(ql&&!shop.some(x=>x.n.toLowerCase()===ql))h+='<div class="row addrow" data-sn="1" style="cursor:pointer;margin-top:10px"><span style="font-size:22px">＋</span><div class="t"><b>Добавить «'+esc(sq.trim())+'»</b></div></div>';
  shop.forEach(x=>{if(!G.some(c=>c[2]===x.s))G.push(cat("s",x.s))});
  G.forEach(c=>{
    let cm=isCat(c[2]),L=shop.filter(x=>x.s===c[2]);
    if(ql)L=L.filter(x=>x.n.toLowerCase().indexOf(ql)>=0);
    else if(smode=="buy"&&cm)L=L.filter(x=>x.b);
    if(!L.length)return;any=true;
    if(cm)L.sort((p,r)=>p.n.localeCompare(r.n,"ru"));
    else L=L.filter(x=>!x.d).concat(L.filter(x=>x.d));
    let nd=L.filter(x=>cm?x.b:!x.d).length,dn=cm?0:L.length-nd,cl=col[c[2]]&&!ql;
    h+='<div class="row" data-sh="'+c[2]+'" style="cursor:pointer;margin-top:10px"><span style="font-size:22px">'+c[1]+'</span><div class="t"><b>'+esc(c[0])+'</b></div><span class="s">'+(cm&&(smode=="all"||ql)?nd+" из "+L.length:nd)+" "+(cl?"▸":"▾")+'</span></div>';
    if(cl)return;
    h+=L.map(itemRow).join("");
    if(dn&&!ql)h+='<button class="lk" data-sc="'+c[2]+'">Убрать купленные ('+dn+')</button>';
  });
  if(!any&&!ql)h+='<div class="empty">Список пуст.</div>';
  return h
}
function addS(){
  let v=sq.trim();if(!v||shopSec===null)return;
  let vl=v.toLowerCase(),x=shop.find(item=>item.n.toLowerCase()===vl);
  if(x){x.b=1;x.d=0}else shop.push({id:Date.now()*1000+Math.floor(Math.random()*1000),n:v,s:shopSec,d:0,b:1});
  sq="";saveS();draw();if(g("si"))g("si").focus()
}
function keepS(){draw()}
function bindShop(top){
  let r=g("sr");if(!r)return;
  if(top){
    let si=g("si");
    si.oninput=()=>{sq=si.value;g("st").innerHTML=statusHtml();g("sr").innerHTML=resHtml();bindShop(false)};
    si.onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();addS()}};
    document.querySelectorAll("[data-ss]").forEach(b=>b.onclick=()=>{shopSec=+b.dataset.ss;draw()});
    document.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{smode=b.dataset.md;lastB=null;draw()});
    if(g("ub"))g("ub").onclick=()=>{let k=sf(String(lastB));if(k>=0){shop[k].b=1;saveS()}lastB=null;draw()};
  }
  r.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{col[b.dataset.sh]=!col[b.dataset.sh];draw()});
  r.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{let k=sf(b.dataset.sd);if(k<0)return;let x=shop[k];
    if(isCat(x.s)){if(smode=="buy"&&!sq.trim()){x.b=0;lastB=x.id}else x.b=x.b?0:1}else x.d=x.d?0:1;
    saveS();draw()});
  r.querySelectorAll("[data-sx]").forEach(b=>b.onclick=e=>{e.stopPropagation();let k=sf(b.dataset.sx);if(k>=0){shop.splice(k,1);saveS();draw()}});
  r.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{shop=shop.filter(x=>!(x.s==b.dataset.sc&&x.d));saveS();draw()});
  r.querySelectorAll("[data-sn]").forEach(b=>b.onclick=addS);
}
function sf(id){return shop.findIndex(x=>String(x.id)==id)}

function settingsHtml(){
  let h='<h1>Настройки</h1>';
  
  h+='<h2>Семья</h2><div class="s" style="font-size:13px;color:var(--mut)">Участники распределения расходов.</div>';
  FAMILY.forEach((name, i)=>{
    h+='<div class="row"><input id="fam'+i+'" value="'+esc(name)+'" maxlength="20" style="flex:1"><button class="lk" data-save-fam="'+i+'">Сохранить</button>'+(FAMILY.length>1?'<button class="x" data-del-fam="'+i+'">×</button>':"")+'</div>';
  });
  h+='<div style="display:flex;gap:8px;margin-top:10px"><input id="newfam" placeholder="Новый участник" maxlength="20"><button class="lk" id="addfam">Добавить</button></div>';

  h+='<h2>Синхронизация и бэкап</h2><div class="s" style="font-size:13px;color:var(--mut)">Данные синхронизируются с облаком автоматически. Также вы можете сделать резервную копию в файл.</div>';
  h+='<div style="display:flex;gap:8px;margin-top:10px"><button class="lk" id="exportBtn" style="flex:1">Экспорт данных</button><button class="lk" id="importBtn" style="flex:1">Импорт данных</button></div><input type="file" id="importFile" style="display:none" accept=".json">';

  h+='<h2>Валюта</h2><div class="cats" style="grid-template-columns:1fr 1fr;margin-top:8px">'+Object.keys(CURS).map(k=>'<button'+(CUR==k?' class="on"':"")+' data-cur="'+k+'">'+CURS[k][0]+" "+CURS[k][1]+'</button>').join("")+'</div>';
  
  h+=catsHtml("e","Категории расходов")+catsHtml("i","Источники доходов")+catsHtml("s","Разделы списка покупок");
  return h;
}

function catsHtml(t,title){
  let h='<h2>'+title+'</h2>';
  LST(t).forEach((c,ix,arr)=>{
    if(ed&&ed.t==t&&ed.id===c[2])h+=edHtml();
    else h+='<div class="row"><span style="font-size:22px">'+c[1]+'</span><div class="t">'+esc(c[0])+'</div>'+mvb(t,c[2],"top","⤒",ix==0)+mvb(t,c[2],"up","↑",ix==0)+mvb(t,c[2],"down","↓",ix==arr.length-1)+'<button class="lk" style="margin-left:6px" data-ed="'+t+":"+c[2]+'">Изменить</button></div>';
  });
  if(ed&&ed.t==t&&ed.id===null)h+=edHtml();
  else h+='<button class="lk" data-new="'+t+'" style="margin-top:6px">+ Добавить</button>';
  return h
}

function draw(){
  ["t0","t1","t2","t3"].forEach((k,n)=>g(k).className=(k=="t2"?"gear ":"")+(view==n?"on":""));
  let h="",inc=cur.t=="i";ensure();
  if(view==0){
    h+='<h1>'+(eix!==null?"Изменить запись":"Новая запись")+'</h1>';
    h+='<label>Кто участвует / платит</label><div class="seg">'+FAMILY.map((w,i)=>'<button class="'+(cur.who==i?"on":"")+'" data-w="'+i+'">'+w+'</button>').join("")+'</div>';
    h+='<div class="seg" style="margin-top:14px"><button class="'+(inc?"":"on")+'" data-t="e">Расход</button><button class="'+(inc?"on":"")+'" data-t="i">Доход</button></div>';
    h+='<label>'+(inc?"Источник":"Категория")+'</label><div class="cats">'+LST(cur.t).map(c=>'<button'+(cur.cat==c[2]?' class="on"':"")+' data-c="'+c[2]+'">'+c[1]+" "+esc(c[0])+'</button>').join("")+'</div>';
    h+='<label for="amt">Сумма, '+CURS[CUR][0]+'</label><input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off">';
    h+='<label for="dt">Дата</label><input id="dt" type="date" value="'+ds(now)+'"><label for="nt">Заметка</label><input id="nt" placeholder="Необязательно">';
    h+='<button class="go" id="go">'+(eix!==null?"Сохранить изменения":inc?"Добавить доход":"Добавить расход")+'</button>'+(eix!==null?'<button class="lk" id="ce" style="width:100%;margin-top:6px">Отмена</button>':"")+'<div class="msg'+(bad?" err":"")+'" role="status">'+esc(msg)+'</div>';
    
    let l=inMonth().map((x,i)=>({x:x,i:items.indexOf(x)})).sort((p,q)=>q.x.d.localeCompare(p.x.d));
    h+='<h2>Записи месяца</h2><div class="s" style="font-size:13px;color:var(--mut)">Нажмите на запись для редактирования.</div>';
    h+=l.length?l.slice(0,lim).map(o=>{let x=o.x,xi=x.t=="i",c=cat(xi?"i":"e",x.c);return '<div class="row" data-r="'+o.i+'" style="cursor:pointer'+(eix===o.i?";background:var(--fld)":"")+'"><span class="dot" style="background:'+getCol(x.w)+'"></span><div class="t"><div>'+c[1]+" "+esc(x.n||c[0])+'</div><div class="s">'+FAMILY[x.w]+", "+dd(x.d)+'</div></div><b class="num'+(xi?" pos":"")+'">'+(xi?"+":"")+eur(x.a)+'</b><button class="x" data-x="'+o.i+'" aria-label="Удалить">×</button></div>'}).join(""):'<div class="empty">В этом месяце записей нет.</div>';
    if(l.length>lim)h+='<button class="lk" id="more" style="width:100%;padding:12px 0">Показать ещё ('+(l.length-lim)+')</button>';
    if(items.some(x=>x.demo))h+='<div class="tiny">Это примеры. <button id="cd">Удалить примеры</button></div>';
  }else if(view==1){
    let L=inMonth(),tot=new Array(FAMILY.length).fill(0),by={},ti=new Array(FAMILY.length).fill(0);
    L.forEach(x=>{if(x.t=="i")ti[x.w]+=x.a;else{tot[x.w]+=x.a;let b=by[x.c]||(by[x.c]=new Array(FAMILY.length).fill(0));b[x.w]+=x.a}});
    let T=tot.reduce((a,b)=>a+b,0),I=ti.reduce((a,b)=>a+b,0),B=I-T;
    
    h+='<h1>Итоги</h1><div class="nav"><button id="pv" aria-label="Предыдущий месяц">‹</button><b>'+mo.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</b><button id="nx" aria-label="Следующий месяц">›</button></div>';
    h+='<div class="s" style="color:var(--mut)">Остаток за месяц</div><div class="num big'+(B<0?" err":"")+'">'+eur(B)+'</div>';
    h+='<div class="who"><span>Доходы <b class="num pos">+'+eur(I)+'</b></span><span>Расходы <b class="num">'+eur(T)+'</b></span></div>';
    if(T>0){
      h+='<h2>Расходы по участникам</h2>'+bar3(tot,T,"");
      h+='<div class="who" style="flex-wrap:wrap;gap:6px 14px">'+FAMILY.map((w,k)=>tot[k]?'<span><span class="dot" style="display:inline-block;background:'+getCol(k)+'"></span> '+w+' <b class="num">'+eur(tot[k])+'</b></span>':"").join("")+'</div>';
      h+=Object.keys(by).map(k=>({c:cat("e",+k),b:by[k],s:by[k].reduce((a,v)=>a+v,0)})).sort((p,q)=>q.s-p.s).map(o=>{
        let b=o.b;return '<div class="cat"><div class="h"><span>'+o.c[1]+" "+esc(o.c[0])+'</span><b class="num">'+eur(o.s)+'</b></div>'+bar3(b,o.s,"width:"+Math.max(8,o.s/T*100)+"%")+'<div class="s" style="font-size:13px;color:var(--mut);margin-top:6px">'+whoSummary(b)+'</div></div>'}).join("");
    }else if(I==0)h+='<div class="empty">За этот месяц данных нет.</div>';
  }else if(view==3){h+=shopHtml()}else{
    h+=settingsHtml();
  }
  g("app").innerHTML=h;

  if(view==2){
    FAMILY.forEach((_, i)=>{
      let sb=document.querySelector('[data-save-fam="'+i+'"]');
      if(sb)sb.onclick=()=>{let v=g("fam"+i).value.trim();if(v){FAMILY[i]=v;saveFamily();draw()}};
      let db=document.querySelector('[data-del-fam="'+i+'"]');
      if(db)db.onclick=()=>{if(FAMILY.length>1){FAMILY.splice(i,1);saveFamily();draw()}};
    });
    let af=g("addfam");
    if(af)af.onclick=()=>{let v=g("newfam").value.trim();if(v){FAMILY.push(v);saveFamily();draw()}};

    let eb=g("exportBtn");
    if(eb)eb.onclick=()=>{
      let data={family:FAMILY,items:items,cats:CATS,inc:INC,sec:SEC,cur:CUR,shop:shop};
      let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      let url=URL.createObjectURL(blob);
      let a=document.createElement("a");a.href=url;a.download="FamilyBudget_Backup.json";a.click();
    };
    let ib=g("importBtn"),ifile=g("importFile");
    if(ib&&ifile){
      ib.onclick=()=>ifile.click();
      ifile.onchange=e=>{
        let f=e.target.files[0];if(!f)return;
        let reader=new FileReader();
        reader.onload=evt=>{
          try{
            let d=JSON.parse(evt.target.result);
            if(d.items)items=d.items;if(d.family)FAMILY=d.family;if(d.cats)CATS=d.cats;if(d.inc)INC=d.inc;if(d.sec)SEC=d.sec;if(d.cur)CUR=d.cur;if(d.shop)shop=d.shop;
            save();saveC();saveFamily();saveS();draw();
            alert("Данные успешно импортированы!");
          }catch(err){alert("Ошибка чтения файла JSON.")}
        };
        reader.readAsText(f);
      }
    }
  }

  document.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{CUR=b.dataset.cur;save();draw()});
  if(view==3)bindShop(true);
  if(g("more"))g("more").onclick=()=>{lim+=10;keep()};
  if(g("go"))g("go").onclick=add;if(g("cd"))g("cd").onclick=clearDemo;
  if(g("pv"))g("pv").onclick=()=>{mo=new Date(mo.getFullYear(),mo.getMonth()-1,1);draw()};
  if(g("nx"))g("nx").onclick=()=>{mo=new Date(mo.getFullYear(),mo.getMonth()+1,1);draw()};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{cur.t=b.dataset.t;cur.cat=0;msg="",bad=false;ensure();keep()});
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{cur.who=+b.dataset.w;keep()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cur.cat=+b.dataset.c;keep()});
  document.querySelectorAll("[data-r]").forEach(r=>r.onclick=()=>startEdit(+r.dataset.r));
  if(g("ce"))g("ce").onclick=()=>{eix=null;msg="";draw()};
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=e=>{e.stopPropagation();del(+b.dataset.x)});
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{let p=b.dataset.mv.split(":"),L=LST(p[0]),k=L.findIndex(c=>c[2]==+p[1]);if(k<0)return;let c=L.splice(k,1)[0],n=p[2]=="top"?0:p[2]=="up"?k-1:k+1;L.splice(Math.max(0,n),0,c);saveC();draw()});
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{let p=b.dataset.ed.split(":"),c=cat(p[0],+p[1]);ed={t:p[0],id:+p[1],n:c[0],e:c[1],k:c[3]?1:0};draw()});
  document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{ed={t:b.dataset.new,id:null,n:"",e:"📦",k:0};draw()});
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ed.n=g("en").value;ed.k=+b.dataset.k;draw()});
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ed.n=g("en").value;ed.e=b.dataset.e;draw()});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));
}
function act(a){
  if(a=="c"){ed=null;return draw()}
  if(a=="x"){ed.n=g("en").value;ed.conf=true;return draw()}
  let L=LST(ed.t);
  if(a=="d"){let idx=L.findIndex(c=>c[2]===ed.id);if(idx>=0)L.splice(idx,1);saveC();ed=null;return draw()}
  let n=g("en").value.trim();ed.n=n;
  if(!n){ed.err="Введите название.";return draw()}
  if(ed.id===null)L.push([n,ed.e,NX++,ed.k]);else{
    let item=L.find(c=>c.id===ed.id||c[2]===ed.id);
    if(item){
      if(ed.t=="s"&&(item[3]?1:0)!==ed.k){shop.forEach(x=>{if(x.s===ed.id){if(ed.k)x.b=x.d?0:1;else x.d=x.b?0:1}});saveS()}
      item[0]=n;item[1]=ed.e;item[3]=ed.k;
    }
  }
  saveC();ed=null;draw()
}
function keep(){let a=g("amt").value,d=g("dt").value,n=g("nt").value;draw();g("amt").value=a;g("dt").value=d;g("nt").value=n}
function tab(n){if(view==n){window.scrollTo({top:0,behavior:"smooth"});return}view=n;nmsg="";if(n==2)ed=null;window.scrollTo(0,0);draw()}

g("t0").onclick=()=>tab(0);
g("t1").onclick=()=>tab(1);
g("t2").onclick=()=>{if(view==2)tab(prev);else{prev=view;tab(2)}};
g("t3").onclick=()=>tab(3);
g("up").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("scroll",()=>g("up").className="up"+((window.pageYOffset||document.documentElement.scrollTop)>300?" show":""));

loadFromCloud().then(() => {
    draw();
});
</script>
</body>
</html>
